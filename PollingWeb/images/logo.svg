<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" role="img"
     aria-label="PollingWeb">
  <title>PollingWeb</title>
  <desc>Logo segnaposto neutro del progetto PollingWeb.</desc>

  <!-- Simbolo: frecce circolari che rappresentano il polling ciclico dei flussi SAP. -->
  <g fill="none" stroke="#2c3e50" stroke-width="3" stroke-linecap="round">
    <path d="M28 10 a18 18 0 1 1 -12.7 5.3"/>
    <path d="M15.3 9.6 v8 h8"/>
  </g>
  <circle cx="28" cy="28" r="5" fill="#2c3e50"/>

  <text x="60" y="37"
        font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="600" fill="#2c3e50">PollingWeb</text>
</svg>
