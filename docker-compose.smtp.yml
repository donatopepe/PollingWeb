services:
  smtp-test:
    image: rnwood/smtp4dev:v3
    ports:
      - "127.0.0.1:2525:25"
      - "127.0.0.1:5080:80"
    environment:
      ServerOptions__HostName: localhost
      ServerOptions__AuthenticationRequired: "true"
      ServerOptions__AuthenticationMode: UsernamePassword
      ServerOptions__Users__0__Username: synthetic-user
      ServerOptions__Users__0__Password: synthetic-password
